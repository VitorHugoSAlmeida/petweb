<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Consultas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">

    <style>
        :root {
            --cor-primaria: #0077cc;
            --cor-secundaria: #00a2ff;
            --cor-gradiente-1: #4facfe;
            --cor-gradiente-2: #00c2ff;
            --cor-destaque: #ffb84d;

            --cor-fundo: #fbf7f1;
            --cor-texto-claro: #ffffff;
            --cor-texto-escuro: #1f2b3a;
            --cor-texto-suave: #667085;
            --cor-borda: #eee2d3;
            --raio-borda: 10px;
            --raio-borda-card: 20px;
            --transicao-padrao: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--cor-fundo);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--cor-texto-claro);
            width: 100%;
            max-width: 720px;
            padding: 40px 45px;
            border-radius: var(--raio-borda-card);
            box-shadow: 0 20px 45px rgba(0, 55, 100, 0.12);
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 30px;
        }

        .cabecalho .icone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            font-size: 28px;
            color: var(--cor-texto-claro);
            background: linear-gradient(150deg, var(--cor-gradiente-1), var(--cor-primaria));
            border-radius: 50%;
            box-shadow: 0 8px 18px rgba(0, 119, 204, 0.3);
        }

        .cabecalho h1 {
            color: var(--cor-primaria);
            font-size: 24px;
            font-weight: 700;
        }

        .cabecalho p {
            color: var(--cor-texto-suave);
            font-size: 14px;
            margin-top: 4px;
        }

        .secao-titulo {
            grid-column: 1 / -1;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cor-primaria);
            margin: 8px 0 2px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--cor-borda);
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .campo.largura-total {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 13px;
            color: var(--cor-texto-escuro);
        }

        .campo-com-icone {
            position: relative;
            display: flex;
            align-items: center;
        }

        .campo-com-icone i {
            position: absolute;
            left: 14px;
            color: var(--cor-texto-suave);
            font-size: 16px;
            pointer-events: none;
        }

        .campo-com-icone textarea + i {
            top: 14px;
            transform: none;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 2px solid var(--cor-borda);
            border-radius: var(--raio-borda);
            outline: none;
            font-size: 14px;
            color: var(--cor-texto-escuro);
            background-color: var(--cor-fundo);
            font-family: inherit;
            transition: var(--transicao-padrao);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: var(--cor-secundaria);
            background-color: var(--cor-texto-claro);
            box-shadow: 0 0 0 4px rgba(0, 162, 255, 0.15);
        }

        input:focus + i,
        textarea:focus + i {
            color: var(--cor-secundaria);
        }

        button {
            grid-column: 1 / -1;
            margin-top: 12px;
            padding: 15px;
            background-color: var(--cor-primaria);
            color: var(--cor-texto-claro);
            border: none;
            border-radius: var(--raio-borda);
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(0, 119, 204, 0.3);
            transition: var(--transicao-padrao);
        }

        button:hover {
            background-color: var(--cor-secundaria);
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(0, 119, 204, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .rodape {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .rodape a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--cor-primaria);
            text-decoration: none;
            font-weight: bold;
        }

        .rodape a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            form {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="cabecalho">
            <span class="icone"><i class="ti ti-clipboard-text" aria-hidden="true"></i></span>
            <h1>Cadastro de Consultas</h1>
            <p>Preencha os dados abaixo para registrar uma consulta</p>
        </div>

        <form th:action="@{/consultas/salvar}" method="post" th:object="${consulta}">

            <input type="hidden" th:field="*{idConsulta}">

            <div class="secao-titulo">Informações da consulta</div>

            <div class="campo">
                <label for="dataConsulta">Data</label>
                <div class="campo-com-icone">
                    <input type="date" id="dataConsulta" th:field="*{dataConsulta}">
                    <i class="ti ti-calendar" aria-hidden="true"></i>
                </div>
            </div>

            <div class="campo">
                <label for="horaConsulta">Hora</label>
                <div class="campo-com-icone">
                    <input type="time" id="horaConsulta" th:field="*{horaConsulta}">
                    <i class="ti ti-clock" aria-hidden="true"></i>
                </div>
            </div>

            <div class="campo largura-total">
                <label for="diagnosticoConsulta">Diagnóstico</label>
                <div class="campo-com-icone">
                    <input type="text" id="diagnosticoConsulta" th:field="*{diagnosticoConsulta}" placeholder="Digite o diagnóstico">
                    <i class="ti ti-stethoscope" aria-hidden="true"></i>
                </div>
            </div>

            <div class="campo largura-total">
                <label for="tratamentoConsulta">Tratamento</label>
                <div class="campo-com-icone">
                    <input type="text" id="tratamentoConsulta" th:field="*{tratamentoConsulta}" placeholder="Digite o tratamento">
                    <i class="ti ti-pill" aria-hidden="true"></i>
                </div>
            </div>

            <div class="campo">
                <label for="valorConsulta">Valor</label>
                <div class="campo-com-icone">
                    <input type="number" step="0.01" id="valorConsulta" th:field="*{valorConsulta}" placeholder="0,00">
                    <i class="ti ti-currency-dollar" aria-hidden="true"></i>
                </div>
            </div>

            <div class="campo largura-total">
                <label for="observacoesConsulta">Observações</label>
                <div class="campo-com-icone">
                    <textarea id="observacoesConsulta" th:field="*{observacoesConsulta}" placeholder="Digite observações da consulta"></textarea>
                    <i class="ti ti-notes" aria-hidden="true"></i>
                </div>
            </div>

            <button type="submit">Salvar consulta</button>

            <p class="rodape">
                <a th:href="@{/consultas/listar}">
                    <i class="ti ti-arrow-left" aria-hidden="true"></i>
                    Voltar para listagem
                </a>
            </p>

        </form>

    </div>

</body>
</html>
