<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes e Animais</title>
    <style>
        :root {
            --cor-primaria: #0077cc;
            --cor-secundaria: #00a2ff;
            --cor-gradiente-1: #4facfe;
            --cor-fundo: #fbf7f1;
            --cor-texto-claro: #ffffff;
            --cor-texto-escuro: #1f2b3a;
            --cor-texto-suave: #667085;
            --cor-borda: #eee2d3;
            --raio-borda: 10px;
            --raio-borda-card: 20px;
            --transicao-padrao: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: var(--cor-fundo);
            padding: 30px;
        }

        .container {
            background-color: var(--cor-texto-claro);
            width: 100%;
            max-width: 900px;
            padding: 40px 45px;
            border-radius: var(--raio-borda-card);
            box-shadow: 0 20px 45px rgba(0, 55, 100, 0.12);
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 30px;
        }

        .cabecalho .icone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            font-size: 28px;
            background: linear-gradient(150deg, var(--cor-gradiente-1), var(--cor-primaria));
            border-radius: 50%;
            box-shadow: 0 8px 18px rgba(0, 119, 204, 0.3);
        }

        .cabecalho h1 {
            color: var(--cor-primaria);
            font-size: 24px;
            font-weight: 700;
        }

        .cabecalho p {
            color: var(--cor-texto-suave);
            font-size: 14px;
            margin-top: 4px;
        }

        .tabela-wrapper {
            overflow-x: auto;
            border: 2px solid var(--cor-borda);
            border-radius: var(--raio-borda);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        thead {
            background: linear-gradient(150deg, var(--cor-gradiente-1), var(--cor-primaria));
            color: var(--cor-texto-claro);
        }

        th,
        td {
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
        }

        th {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        td {
            color: var(--cor-texto-escuro);
        }

        tbody tr {
            border-bottom: 1px solid var(--cor-borda);
            transition: background-color var(--transicao-padrao);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:nth-child(even) {
            background-color: var(--cor-fundo);
        }

        tbody tr:hover {
            background-color: rgba(0, 162, 255, 0.10);
        }

        /* Botão voltar */
        .acoes {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 26px;
            background-color: var(--cor-primaria);
            color: var(--cor-texto-claro);
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.3px;
            border-radius: var(--raio-borda);
            box-shadow: 0 10px 22px rgba(0, 119, 204, 0.3);
            transition: var(--transicao-padrao);
        }

        .btn-voltar:hover {
            background-color: var(--cor-secundaria);
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(0, 119, 204, 0.35);
        }

        .btn-voltar:active {
            transform: translateY(0);
        }

        .btn-voltar:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 162, 255, 0.3);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 30px 20px;
            }

            .cabecalho h1 {
                font-size: 20px;
            }

            th,
            td {
                padding: 10px 12px;
                font-size: 13px;
            }

            .btn-voltar {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="cabecalho">
            <span class="icone">🐾</span>
            <h1>Lista de Tutores e Animais</h1>
            <p>Confira os tutores e seus respectivos animais</p>
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Tutor</th>
                        <th>Telefone</th>
                        <th>Animal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="resultado : ${resultados}">
                        <td th:text="${resultado.nomeCliente}"></td>
                        <td th:text="${resultado.telefoneCliente}"></td>
                        <td th:text="${resultado.nomeAnimal}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="acoes">
            <a class="btn-voltar" th:href="@{/home}">
                <span aria-hidden="true">←</span>
                Voltar para a home
            </a>
        </div>
    </main>
</body>
</html>
