spring.application.name=petweb

# Configurações do banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/petweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Configurações do JPA/Hibernate
# Atualize as tabelas do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

# Exibir no terminal as consultas SQL geradas
spring.jpa.show-sql=true

# Limpar o cache para a execução do Thymeleaf
spring.thymeleaf.cache=false

# Configurações do servidor
server.port=8080

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from=${TWILIO_FROM:}
